name: Update permitted feeds
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import permitted RSS/Atom feeds
        run: python3 scripts/update.py
      - name: Check explicitly approved public pages
        run: python3 scripts/collect_pages.py
      - name: Commit new discoveries
        run: |
          if ! git diff --quiet -- data/listings.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/listings.json
            git commit -m 'Update Wagon Watch discoveries'
            git push
          fi
